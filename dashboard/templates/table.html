{% extends "base.html" %}
{% block content %}
<h1>{{ title }}</h1>
{% if hint %}
<div class="alert alert-info">{{ hint }}</div>
{% endif %}
<div class="table-responsive">
  <table class="table table-sm table-striped align-middle">
    <thead>
      <tr>{% for col in columns %}<th>{{ ui_label(col) }}</th>{% endfor %}</tr>
    </thead>
    <tbody>
      {% for row in rows %}
      <tr>
        {% for col in columns %}
        <td class="{% if col == 'trend' %}trend-cell trend-{{ row[col]|string|lower|replace(' ', '-') }}{% endif %}">{{ row[col] }}</td>
        {% endfor %}
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
