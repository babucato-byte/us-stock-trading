<!doctype html>
<html lang="ko" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>자동매매 운영 관제 대시보드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='dashboard.css') }}" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg border-bottom">
      <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('index') }}">자동매매 운영 관제</a>
        <div class="navbar-nav flex-row gap-3">
          <a class="nav-link" href="{{ url_for('performance') }}">성과 분석</a>
          <a class="nav-link" href="{{ url_for('settings') }}">설정</a>
          <a class="nav-link" href="{{ url_for('logs') }}">로그</a>
        </div>
      </div>
    </nav>
    <main class="container-fluid py-4">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert alert-info">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
